[package]
name = "bobagent-desktop"
version = "0.2.1"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2.14.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
rand = "0.9"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
