name: Release

# Push a v* tag (matching apps/desktop/src-tauri/tauri.conf.json "version") to build the
# macOS app/dmg, Linux AppImage/deb, and unsigned Windows NSIS installer. The release remains
# a draft until every platform's updater metadata has been verified. Dispatch requires a tag.
# macOS signing/notarization run when the APPLE_* secrets are configured.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          tag="$REF_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
          fi
          if [[ ! "$tag" =~ ^v[0-9] ]]; then
            echo "Expected a version tag such as v0.3.0; got '$tag'." >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            if [ "$(jq -r .draft "$RUNNER_TEMP/release.json")" != "true" ]; then
              echo "Release $tag already exists and is not a draft." >&2
              exit 1
            fi
            id="$(jq -r .id "$RUNNER_TEMP/release.json")"
          else
            gh release create "$tag" --draft --title "UpBot $tag" \
              --notes "See the commits since the previous release."
            id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            bundles: app,dmg
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev build-essential zip unzip
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Enable Apple signing when configured
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
            done
            echo "Code signing enabled"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                { echo "$v<<__EOF__"; printenv "$v"; echo "__EOF__"; } >> "$GITHUB_ENV"
              done
              echo "Notarization enabled"
            fi
          else
            echo "APPLE_* secrets not set: building unsigned"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: bunx tauri
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.updater.conf.json
          releaseId: ${{ needs.create-release.outputs.id }}
          tagName: ${{ needs.create-release.outputs.tag }}
          includeUpdaterJson: true

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - name: Verify updater metadata and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          dir="$RUNNER_TEMP/upbot-release"
          mkdir -p "$dir"
          gh release download "$TAG" --pattern latest.json --dir "$dir"
          python3 - "$dir/latest.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text())
          platforms = data.get("platforms", {})
          required = ("darwin-aarch64", "linux-x86_64", "windows-x86_64")
          missing = [prefix for prefix in required if not any(key.startswith(prefix) for key in platforms)]
          if missing:
              print(
                  "latest.json is missing updater platforms: "
                  + ", ".join(missing)
                  + ". Re-run the failed platform build job to restore the merged metadata.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
          gh release edit "$TAG" --draft=false --latest
